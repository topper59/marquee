# Installed at /etc/NetworkManager/dnsmasq-shared.d/captive.conf
#
# NetworkManager feeds this directory only to the dnsmasq instance it spawns
# for *shared* connections (the setup AP's ipv4.method=shared). It is inert in
# station mode, so it is safe to leave installed permanently.
#
# Answer every DNS name with the AP address so any http fetch a phone makes
# lands on the portal — that is what pops the OS captive-portal sheet.
address=/#/10.42.0.1

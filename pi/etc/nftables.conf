#!/usr/sbin/nft -f
# Marquee firewall: default-drop inbound; the web UI is the only intended
# surface. SSH is *allowed* here but the sshd service is off on shipped
# devices — the settings page toggles the service, not the firewall, so a
# hole in this file is never what stands between a stranger and a shell.
#
# 53/67 serve the captive portal's dnsmasq, which only runs in AP mode; in
# station mode nothing listens there and the kernel refuses the connection
# anyway. Static rules beat swapping rulesets on an AP/station transition on
# a device whose only link is the interface being reconfigured.

flush ruleset

table inet filter {
        chain input {
                type filter hook input priority 0; policy drop;

                iif "lo" accept
                ct state established,related accept
                ct state invalid drop

                meta l4proto { icmp, ipv6-icmp } accept

                tcp dport 80 accept             # web UI + captive portal
                tcp dport 22 accept             # sshd (service off by default)
                udp dport 5353 accept           # mDNS — marquee.local
                udp dport { 53, 67 } accept     # AP mode: captive DNS + DHCP
                tcp dport 53 accept
                udp dport 68 accept             # DHCP client renewals (broadcast)
                udp dport 546 accept            # DHCPv6 client
        }
        chain forward {
                # AP clients only ever talk to the portal itself.
                type filter hook forward priority 0; policy drop;
        }
}
